<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="heading">Guessing Game</div>
    <div>
        Best Score : <span id="bestScore">0</span>
    </div>
    <div >
        <input type="number" placeholder="Enter a number between 1 and 100" id="numberEntered">
    </div>
    <div id="status">Let's Start</div>
    <div >
        Attempts :<span id="attempt">0</span>
    </div>

    <button id="reset">New game</button>

    <script src="game.js"></script>
</body>
</html>
